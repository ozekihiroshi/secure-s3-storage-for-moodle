name: Moodle Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Moodle 5.2 / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            database: mariadb
          - php: '8.4'
            database: pgsql

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.8' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mysqli, pgsql, sodium, zip
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project --no-dev --prefer-dist --no-interaction moodlehq/moodle-plugin-ci:4.5.11 ci
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install pinned plugin runtime
        working-directory: plugin
        run: >-
          composer install
          --no-dev
          --classmap-authoritative
          --no-interaction
          --no-progress
          --no-scripts

      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: Isolate third-party runtime from author checks
        run: mv moodle/public/admin/tool/secure_s3_storage/vendor "$RUNNER_TEMP/secure-s3-storage-vendor"

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 --test-version 8.2-8.4

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Restore third-party runtime
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/secure-s3-storage-vendor" ]; then
            mv "$RUNNER_TEMP/secure-s3-storage-vendor" moodle/public/admin/tool/secure_s3_storage/vendor
          fi

      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoint check
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancellation as failure
        if: ${{ cancelled() }}
        run: exit 1
